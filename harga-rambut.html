<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harga Perawatan Rambut</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo-text">
      <h1>Humaira Salon</h1>
      <p>Your Daily Beauty Partner</p>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="treatment.html" class="active">Treatment</a>
      <a href="about.html">About Us</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="price-page">
    <section class="price-card">
      <div class="price-header">
        <h2>Perawatan Rambut</h2>
        <p>Pilih layanan, tentukan tanggal & jam, lalu booking via WhatsApp</p>
      </div>

      <!-- MEMBER WELCOME BANNER -->
      <p id="memberWelcome" style="display: none; background: rgba(255,255,255,0.15); padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; font-weight: 500; font-size: 14px; text-align: center; border: 1px dashed rgba(255,255,255,0.2);"></p>

      <!-- GUEST INFO SECTION (Hanya jika belum login) -->
      <div class="booking-meta" id="guestInfoSection">
        <div class="field-group">
          <label for="guestName">Nama Anda (Tamu)</label>
          <input type="text" id="guestName" placeholder="Masukkan nama lengkap" style="width: 100%; border: none; border-radius: 10px; padding: 10px; font-size: 14px; outline: none; background: #fff; color: #333;">
        </div>
        <div class="field-group">
          <label for="guestPhone">Nomor WhatsApp</label>
          <input type="text" id="guestPhone" placeholder="Contoh: 089646946880" style="width: 100%; border: none; border-radius: 10px; padding: 10px; font-size: 14px; outline: none; background: #fff; color: #333;">
        </div>
      </div>

      <!-- DATE & TIME SELECTION -->
      <div class="booking-meta" style="margin-top: 15px;">
        <div class="field-group">
          <label for="bookingDate">Tanggal Booking</label>
          <input type="date" id="bookingDate">
        </div>
        <div class="field-group">
          <label for="bookingTime">Jam Booking</label>
          <input type="time" id="bookingTime">
        </div>
      </div>

      <!-- SERVICE LIST CONTAINER -->
      <div class="service-list" id="serviceList">
        <p style="text-align: center; padding: 20px; opacity: 0.8;">Memuat daftar perawatan rambut...</p>
      </div>

      <div class="checkout-box">
        <div class="total-line">
          <span>Total</span>
          <strong id="grandTotal">Rp0</strong>
        </div>
        <button id="bookingBtn" class="wa-btn" type="button">Booking Now (WhatsApp)</button>
      </div>
    </section>
  </main>

  <script src="booking.js"></script>
</body>

</html>
