<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Konsultasi Forum - Humaira Salon</title>
  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    .profile-page {
      min-height: 100vh;
      background: url('images/bg.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      position: relative;
    }

    .profile-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(5px);
      z-index: 1;
    }

    .profile-container {
      position: relative;
      z-index: 2;
      width: min(1100px, 100%);
      background: rgba(141, 95, 95, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      padding: 40px;
      color: #fff;
      animation: fadeUp 0.8s ease;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .dash-header h2 {
      font-size: 28px;
      font-family: var(--font-heading);
      color: var(--accent-gold-glow);
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(-3px);
    }

    /* STATS CARD */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      transition: 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.12);
    }

    .stat-card p {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 8px;
    }

    .stat-card h3 {
      font-size: 30px;
      font-weight: 700;
    }

    /* TABS */
    .tabs-container {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 15px;
      transition: 0.3s;
      border-bottom: 2px solid transparent;
      font-family: var(--font-body);
    }

    .tab-btn:hover {
      color: #fff;
    }

    .tab-btn.active {
      color: var(--accent-gold-glow);
      border-bottom: 2px solid var(--accent-gold);
    }

    /* DATA TABLES */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .section-title {
      font-size: 20px;
      font-family: var(--font-heading);
      border-left: 4px solid var(--accent-gold);
      padding-left: 10px;
      color: var(--accent-gold-glow);
    }

    .reset-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ff8b8b;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    .reset-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      transform: translateY(-1px);
    }

    .table-container {
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: rgba(255, 255, 255, 0.08);
      padding: 15px 18px;
      font-weight: 600;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* BADGES */
    .status-badge {
      padding: 6px 12px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      text-align: center;
    }

    .status-badge.pending {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-badge.answered {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .status-badge.resolved {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* BUTTONS */
    .action-btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      color: white;
      transition: 0.2s;
    }

    .btn-action.answer {
      background: linear-gradient(135deg, var(--accent-pink), #db2777);
    }

    .btn-action.answer:hover {
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.25);
    }

    .btn-action.edit {
      background: #4b5563;
    }

    .btn-action.edit:hover {
      background: #374151;
    }

    .btn-action.resolve {
      background: #10b981;
    }

    .btn-action.resolve:hover {
      background: #059669;
    }

    /* MODAL WINDOWS */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #8d5f5f;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      color: white;
      animation: zoomIn 0.3s ease;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      opacity: 0.8;
    }

    .modal-close:hover {
      opacity: 1;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      opacity: 0.95;
    }

    .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 14px;
      outline: none;
      resize: none;
      box-sizing: border-box;
      font-family: var(--font-body);
    }

    .modal-submit-btn {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    .modal-submit-btn:hover {
      background: #059669;
    }
  </style>
</head>

<body>

  <section class="profile-page">
    <div class="profile-container">

      <!-- Header Dashboard -->
      <div class="dash-header">
        <div>
          <a href="profile.html" class="back-btn">← Dashboard Utama</a>
        </div>
        <h2>💬 Dashboard Konsultasi Forum</h2>
        <div>
          <button class="logout-btn" onclick="handleLogout()">Keluar Admin</button>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <p>Total Sudah Terjawab / Resolved</p>
          <h3 id="statAnswered" style="color: #10b981;">0</h3>
        </div>
        <div class="stat-card">
          <p>Menunggu Jawaban (Pending)</p>
          <h3 id="statPending" style="color: #f59e0b;">0</h3>
        </div>
      </div>

      <!-- Table Section Header -->
      <div class="section-header">
        <div class="section-title">Kelola Tanya Jawab Forum</div>
        <button class="reset-btn" onclick="resetAllConsultations()">🧹 Hapus Semua Pertanyaan</button>
      </div>

      <!-- TABS -->
      <div class="tabs-container">
        <button class="tab-btn active" id="tab-menunggu" onclick="switchTab('Menunggu Jawaban')">🟡 Menunggu Jawaban</button>
        <button class="tab-btn" id="tab-diskusi" onclick="switchTab('Sedang Diskusi')">🔵 Sedang Diskusi</button>
        <button class="tab-btn" id="tab-terjawab" onclick="switchTab('Terjawab')">🟢 Terjawab</button>
      </div>

      <!-- DATA TABLE -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 5%;">No</th>
              <th style="width: 15%;">Penanya</th>
              <th style="width: 20%;">Topik / Judul</th>
              <th style="width: 40%;">Pertanyaan & Diskusi Balasan</th>
              <th style="width: 10%;">Status</th>
              <th style="width: 10%;">Aksi</th>
            </tr>
          </thead>
          <tbody id="consultTableBody">
            <tr>
              <td colspan="6" style="text-align: center; opacity: 0.7; padding: 25px;">Memuat forum diskusi...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </section>

  <!-- REPLY CONSULTATION MODAL -->
  <div id="answerModal" class="modal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h3 style="font-family: var(--font-heading); color: var(--accent-gold-glow); font-size: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">Berikan Balasan Diskusi</h3>
      
      <form id="answerForm" onsubmit="handleSendReply(event)">
        <input type="hidden" id="modalConsultId">
        
        <div class="form-group">
          <label>Topik Diskusi / Pertanyaan</label>
          <div id="modalQuestionText" style="padding: 12px; background: rgba(0,0,0,0.15); border-radius: 10px; font-size: 13.5px; line-height: 1.5; font-style: italic; opacity: 0.9;">
            "Pertanyaan"
          </div>
        </div>

        <div class="form-group">
          <label for="modalAnswerText">Tanggapan Admin / Pemilik Salon</label>
          <textarea id="modalAnswerText" rows="5" required placeholder="Tuliskan balasan untuk pertanyaan tersebut..."></textarea>
        </div>

        <button type="submit" id="modalSubmitBtn" class="modal-submit-btn">💾 Kirim Balasan</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = window.location.port && window.location.port !== '3000' && window.location.port !== '80' && window.location.port !== '443' ? 'http://localhost:3000' : '';

    // Auth Guard Client-Side
    (async function checkAuth() {
      const token = localStorage.getItem("humaira_token");
      if (!token) {
        alert("Akses ditolak! Anda harus masuk sebagai admin.");
        window.location.href = "profile.html";
        return;
      }
      
      try {
        const res = await fetch(`${API_URL}/api/auth/me`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Invalid Session");
        const data = await res.json();
        if (data.role !== 'admin') throw new Error("Not Authorized");
      } catch (err) {
        alert("Sesi admin tidak valid. Silakan login kembali.");
        localStorage.removeItem("humaira_token");
        localStorage.removeItem("humaira_user");
        window.location.href = "profile.html";
      }
    })();

    document.addEventListener("DOMContentLoaded", () => {
      loadConsultations();
    });

    let allConsultations = [];
    let currentTab = 'Menunggu Jawaban';

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tabName === 'Menunggu Jawaban') document.getElementById('tab-menunggu').classList.add('active');
      if (tabName === 'Sedang Diskusi') document.getElementById('tab-diskusi').classList.add('active');
      if (tabName === 'Terjawab') document.getElementById('tab-terjawab').classList.add('active');
      renderTable();
    }

    async function loadConsultations() {
      const token = localStorage.getItem("humaira_token");
      const statAnsweredEl = document.getElementById("statAnswered");
      const statPendingEl = document.getElementById("statPending");

      try {
        const response = await fetch(`${API_URL}/api/admin/consultations`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || "Gagal mengambil data forum konsultasi.");
        }
        allConsultations = await response.json();

        // 1. Gather stats counters
        const pendingCount = allConsultations.filter(item => item.status === 'Menunggu Jawaban').length;
        const answeredCount = allConsultations.filter(item => item.status === 'Terjawab' || item.status === 'Selesai').length;

        statPendingEl.textContent = pendingCount;
        statAnsweredEl.textContent = answeredCount;

        renderTable();
      } catch (err) {
        document.getElementById("consultTableBody").innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ff8b8b;">${err.message}</td></tr>`;
      }
    }

    function renderTable() {
      const tbody = document.getElementById("consultTableBody");
      
      const filteredList = allConsultations.filter(item => {
        if (currentTab === 'Terjawab') {
          return item.status === 'Terjawab' || item.status === 'Selesai';
        }
        return item.status === currentTab;
      });

      if (filteredList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; opacity: 0.7; padding: 25px;">Tidak ada data diskusi untuk tab ini.</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredList.map((item, index) => {
        let statusText = item.status;
        let statusClass = 'pending';
        if (item.status === 'Terjawab' || item.status === 'Selesai') {
          statusClass = 'resolved';
        } else if (item.status === 'Sedang Diskusi') {
          statusClass = 'answered';
        }

        let actionButtons = '';
        if (item.status !== 'Terjawab' && item.status !== 'Selesai') {
          // Admin can reply
          // Question text is the first message by member
          let questionText = item.judul;
          if (item.ConsultationMessages && item.ConsultationMessages.length > 0) {
             questionText = item.ConsultationMessages[0].pesan;
          }

          actionButtons = `
            <div class="action-btn-group" style="display:flex; flex-direction:column; gap:8px;">
              <button class="btn-action answer" onclick="openAnswerModal(${item.id}, \`${questionText.replace(/`/g, '\\`').replace(/"/g, '&quot;').replace(/\n/g, ' ')}\`)">💬 Tulis Balasan</button>
            </div>
          `;
        } else {
          actionButtons = `<span style="font-size: 12.5px; opacity: 0.6; text-align:center; display:block;">✓ Terkunci</span>`;
        }

        const repliesHtml = (item.ConsultationMessages || []).map(reply => {
          const isAdmin = reply.sender_type === 'terapis';
          const author = isAdmin ? '👑 Terapis ✓' : `👤 ${item.User?.name || 'Member'}`;
          return `<div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); color: ${isAdmin ? 'var(--accent-gold-glow)' : '#ddd'}; font-size: 13px;"><strong>${author}:</strong> "${reply.pesan}"</div>`;
        }).join('');

        return `
          <tr>
            <td>${index + 1}</td>
            <td>
              <strong>${item.User?.name || 'User'}</strong><br>
              <span style="font-size:11px; opacity:0.7;">Pesan: ${(item.ConsultationMessages || []).length}</span>
            </td>
            <td><span style="background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 40px; font-size: 12px;">${item.judul}</span></td>
            <td>
              <div style="max-height: 150px; overflow-y: auto; padding-right: 5px;">
                ${repliesHtml}
              </div>
            </td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td>${actionButtons}</td>
          </tr>
        `;
      }).join('');
    }

    // Modal Operations
    function openAnswerModal(id, question) {
      document.getElementById("modalConsultId").value = id;
      document.getElementById("modalQuestionText").textContent = `"${question}"`;
      document.getElementById("modalAnswerText").value = "";
      document.getElementById("answerModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("answerModal").style.display = "none";
    }

    async function handleSendReply(event) {
      event.preventDefault();
      const id = document.getElementById("modalConsultId").value;
      const pesan = document.getElementById("modalAnswerText").value.trim();
      const token = localStorage.getItem("humaira_token");
      
      const submitBtn = document.getElementById("modalSubmitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Mengirim balasan...";

      try {
        const response = await fetch(`${API_URL}/api/consultations/${id}/reply`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ pesan })
        });

        const resData = await response.json();
        if (!response.ok) throw new Error(resData.message || 'Gagal mengirim balasan.');

        alert("Sukses mengirim balasan diskusi!");
        closeModal();
        loadConsultations();
      } catch (err) {
        alert(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "💾 Kirim Balasan";
      }
    }

    // Removed resolveConsultation since admin cannot resolve

    async function resetAllConsultations() {
      if (!confirm("PERINGATAN BULANAN: Anda akan menghapus seluruh data pertanyaan forum konsultasi dari database secara permanen.\n\nApakah Anda yakin?")) return;
      if (!confirm("Konfirmasi sekali lagi: Hapus semua keluhan & pertanyaan forum?")) return;

      const token = localStorage.getItem("humaira_token");
      try {
        const response = await fetch(`${API_URL}/api/admin/consultations`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error("Gagal mereset forum konsultasi.");
        alert("Forum konsultasi berhasil direset (dikosongkan)!");
        loadConsultations();
      } catch (err) {
        alert(err.message);
      }
    }

    function handleLogout() {
      localStorage.removeItem("humaira_token");
      localStorage.removeItem("humaira_user");
      alert("Anda telah keluar dari panel admin.");
      window.location.href = "profile.html";
    }
  </script>
</body>

</html>
